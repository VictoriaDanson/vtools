<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日灵感</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>每日灵感</h1>

      <div class="input-section">
        <textarea id="input" placeholder="记录此刻的灵感..."></textarea>
        <div class="btn-row">
          <button id="submitBtn">记录</button>
        </div>
      </div>

      <div class="list-section">
        <div class="list-title">历史记录</div>
        <div id="list"></div>
      </div>
    </div>

    <script>
      const input = document.getElementById('input')
      const submitBtn = document.getElementById('submitBtn')
      const list = document.getElementById('list')

      // API基础URL
      const API_BASE = 'http://localhost:3000/api/inspirations'

      // 从服务器加载数据
      async function loadItems() {
        try {
          const response = await fetch(API_BASE)
          if (!response.ok) {
            throw new Error('网络请求失败')
          }
          const items = await response.json()
          return items || []
        } catch (error) {
          console.error('加载数据失败:', error)
          return []
        }
      }

      // 格式化日期
      function formatDate(timestamp) {
        const date = new Date(timestamp)
        const y = date.getFullYear()
        const m = String(date.getMonth() + 1).padStart(2, '0')
        const d = String(date.getDate()).padStart(2, '0')
        const h = String(date.getHours()).padStart(2, '0')
        const min = String(date.getMinutes()).padStart(2, '0')
        return `${y}-${m}-${d} ${h}:${min}`
      }

      // 渲染列表
      async function render() {
        const items = await loadItems()

        if (items.length === 0) {
          list.innerHTML =
            '<div class="empty-tip">暂无记录，写下你的第一个灵感吧</div>'
          return
        }

        list.innerHTML = items
          .map(
            (item) => `
                <div class="item">
                    <span class="item-delete" onclick="deleteItem(${item.id})">删除</span>
                    <div class="item-date">${formatDate(item.time)}</div>
                    <div class="item-content">${escapeHtml(item.content)}</div>
                </div>
            `
          )
          .join('')
      }

      // 转义 HTML
      function escapeHtml(text) {
        const div = document.createElement('div')
        div.textContent = text
        return div.innerHTML
      }

      // 添加记录
      async function add() {
        const content = input.value.trim()
        if (!content) return

        try {
          const response = await fetch(API_BASE, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content })
          })

          if (!response.ok) {
            throw new Error('添加记录失败')
          }

          input.value = ''
          await render()
        } catch (error) {
          console.error('添加记录失败:', error)
        }
      }

      // 删除记录
      async function deleteItem(id) {
        try {
          const response = await fetch(`${API_BASE}/${id}`, {
            method: 'DELETE'
          })

          if (!response.ok) {
            throw new Error('删除记录失败')
          }

          await render()
        } catch (error) {
          console.error('删除记录失败:', error)
        }
      }

      // 事件绑定
      submitBtn.addEventListener('click', add)

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
          e.preventDefault()
          add()
        }
      })

      // 初始渲染
      render()
    </script>
  </body>
</html>
